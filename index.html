<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cama de pared + escritorio + cajones</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f1ec;--fg:#2a2622;--mut:#6d655b;--card:#ffffff;--ac:#8a5a2b;--acf:#fff;--bd:#d9d2c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ece6dc;--mut:#a79e91;--card:#2a2724;--ac:#e0a768;--acf:#1d1b19;--bd:#3d3934}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#ece6dc;--mut:#a79e91;--card:#2a2724;--ac:#e0a768;--acf:#1d1b19;--bd:#3d3934}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:12px 16px 4px}
h1{font-size:18px;margin:0 0 2px}
header p{margin:0;font-size:13px;color:var(--mut)}
#v{flex:1;min-height:0;position:relative;touch-action:none;cursor:grab}
#v canvas{display:block;width:100%;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;justify-content:center}
button{font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.on{background:var(--ac);color:var(--acf);border-color:var(--ac)}
.info{padding:0 16px 12px;font-size:12.5px;color:var(--mut);text-align:center}
</style>
</head>
<body>
<header>
  <h1>Cama de pared + escritorio + cajones</h1>
  <p>Arrastrá para rotar · rueda o pellizco para acercar</p>
</header>
<div id="v"></div>
<div class="bar">
  <button id="b1" class="on">Cerrada + escritorio</button>
  <button id="b2">Cerrada</button>
  <button id="b3">Cama abierta</button>
</div>
<div class="info">Colchón 140 × 190 cm · cajoneras 45 × 45 × 55 cm · escritorio 140 × 60 cm a 75 cm · ancho total 235 cm · fondo con cama abierta ≈ 217 cm</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const wrap=document.getElementById('v');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
wrap.appendChild(R.domElement);
const S=new THREE.Scene();
const C=new THREE.PerspectiveCamera(40,1,1,3000);
S.add(new THREE.HemisphereLight(0xffffff,0x887766,.95));
const L=new THREE.DirectionalLight(0xffffff,.7);L.position.set(200,400,300);S.add(L);

function box(p,w,h,d,col,x,y,z){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:col}));
  m.position.set(x,y,z);p.add(m);return m;
}
const WOOD=0xc89a5c, WOOD2=0xb98a52, FRONT=0xd8b27a, DARK=0x4a3a2a;

// piso y pared
box(S,520,1,420,0xcfc6b8,0,-.5,150);
box(S,520,300,2,0xe9e4da,0,150,-1);

// estructura fija
box(S,145,236,2,WOOD2,0,118,1);
for(const sx of [-1,1]) box(S,2.5,235,50,WOOD,sx*71.25,117.5,25);
box(S,147.5,2.5,50,WOOD,0,236.25,25);

// cajoneras (mesas de luz)
for(const sx of [-1,1]){
  const cx=sx*95;
  box(S,45,55,45,WOOD,cx,27.5,22.5);
  box(S,47,2,47,WOOD2,cx,56,23.5);
  for(const y of [15,42]){
    box(S,41,24,2,FRONT,cx,y,46);
    box(S,12,2,2,DARK,cx,y+6,48);
  }
}

// cama (pivota en el borde del cabecero)
const B=new THREE.Group();B.position.set(0,35,27);S.add(B);
box(B,140,6,190,WOOD,0,3,95);
box(B,138,19,188,0xefebe3,0,15.5,95);
box(B,138.5,3,120,0x5b7a99,0,26.5,120);
for(const sx of [-1,1]) box(B,60,8,35,0xffffff,sx*33,29,25);
const bedLegs=[];
for(const sx of [-1,1]) bedLegs.push(box(B,5,35,5,WOOD2,sx*62,-17.5,186));

// escritorio abatible (hijo de la cama)
const D=new THREE.Group();D.position.set(0,0,40);B.add(D);
box(D,140,2,60,WOOD2,0,-1,30);
const deskLegs=[];
for(const sx of [-1,1]) deskLegs.push(box(D,4,73,4,WOOD,sx*66,-38.5,57));

// animación
let t=1,s=1;const tgt={t:1,s:1};
function apply(){
  B.rotation.x=-Math.PI/2*t;
  D.rotation.x=Math.PI/2*s;
  bedLegs.forEach(m=>m.visible=t<.5);
  deskLegs.forEach(m=>m.visible=s>.7);
}
function step(){
  const bedMoving=Math.abs(tgt.t-t)>.001;
  const ds=bedMoving?0:tgt.s;
  s+=Math.sign(ds-s)*Math.min(Math.abs(ds-s),.04);
  if(bedMoving&&s<.01) t+=Math.sign(tgt.t-t)*Math.min(Math.abs(tgt.t-t),.02);
}
const btns=[b1,b2,b3];
function setState(i,a,b){tgt.t=a;tgt.s=b;btns.forEach((x,j)=>x.classList.toggle('on',i===j));}
b1.onclick=()=>setState(0,1,1);
b2.onclick=()=>setState(1,1,0);
b3.onclick=()=>setState(2,0,0);

// cámara orbital
let yaw=-.6,pitch=.22,dist=520;const target=new THREE.Vector3(0,115,110);
function cam(){
  C.position.set(target.x+dist*Math.sin(yaw)*Math.cos(pitch),target.y+dist*Math.sin(pitch),target.z+dist*Math.cos(yaw)*Math.cos(pitch));
  C.lookAt(target);
}
const pts=new Map();let lastPinch=0;
wrap.addEventListener('pointerdown',e=>{wrap.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);});
wrap.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId);
  if(pts.size===1){yaw-=(e.clientX-p[0])*.008;pitch=Math.max(.02,Math.min(1.4,pitch+(e.clientY-p[1])*.006));}
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){
    const [a,b]=[...pts.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(lastPinch)dist=Math.max(200,Math.min(900,dist*lastPinch/d));
    lastPinch=d;
  }
});
const up=e=>{pts.delete(e.pointerId);lastPinch=0;};
wrap.addEventListener('pointerup',up);wrap.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(200,Math.min(900,dist*(1+e.deltaY*.001)));},{passive:false});

function resize(){
  const w=wrap.clientWidth,h=wrap.clientHeight;
  R.setSize(w,h,false);C.aspect=w/h;C.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);resize();
(function loop(){requestAnimationFrame(loop);step();apply();cam();R.render(S,C);})();
</script>
</body>
</html>
